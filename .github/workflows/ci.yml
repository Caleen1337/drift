name: CI

on:
  push:
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.9"
      - name: Run Core tests
        working-directory: Core
        run: swift test

  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project Drift.xcodeproj \
            -scheme Drift \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned IPA
        run: |
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name 'Drift.app' | head -n1)"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr Drift-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Drift-unsigned-ipa
          path: Drift-unsigned.ipa
